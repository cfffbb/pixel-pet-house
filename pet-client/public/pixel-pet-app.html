<!doctype html>
<!--
  像素宠物小屋 · 桌面陪伴应用（v3）
  视觉完全沿用 pixel-pet-cottage.html：像素宠物引擎、暖色小屋场景、圆润厚边按钮。
  功能按后端 v2 提示词：认证、6 个场景（拉小球切换）、悬浮宠物小球、14 页功能、管理后台。
  接口统一 http://localhost:8080，Authorization: Bearer <token>，返回 {code,msg,data}；
  后端未连接时进入「演示模式」。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>像素宠物小屋 · 桌面陪伴</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Press+Start+2P&display=swap" rel="stylesheet" />
<style>
/* ─── 令牌（沿用 pixel-pet-cottage.html）────────────── */
:root{
  --bg:      oklch(98% 0.004 240);
  --surface: oklch(100% 0 0);
  --fg:      oklch(20% 0.02 240);
  --muted:   oklch(50% 0.018 240);
  --border:  oklch(90% 0.006 240);
  --accent:  oklch(56% 0.12 170);
  --accent-soft: color-mix(in oklch, var(--accent) 14%, transparent);
  --fg-soft:     color-mix(in oklch, var(--fg) 6%, transparent);
  --font-display: 'ZCOOL KuaiLe','Avenir Next','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  --font-body:    -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Segoe UI',system-ui,sans-serif;
  --font-mono:    ui-monospace,'JetBrains Mono','SF Mono',Menlo,Consolas,monospace;
  --font-pix:     'Press Start 2P', ui-monospace, monospace;
  --fs-h1: clamp(34px,4.6vw,54px);
  --fs-h2: clamp(26px,3.2vw,38px);
  --fs-lead: 17px;
  --fs-body: 15px;
  --fs-meta: 12px;
  --gap-xs:8px; --gap-sm:12px; --gap-md:18px; --gap-lg:28px; --gap-xl:44px;
  --container:1080px; --gutter:24px;
  --radius:14px; --radius-lg:20px; --radius-xl:999px;

  /* 场景像素调色板（与 v1 一致） */
  --p-line:    oklch(30% 0.045 60);
  --p-ink:     oklch(18% 0.03 60);
  --p-cream:   oklch(96.5% 0.02 90);
  --p-pink:    oklch(80% 0.09 15);
  --p-heart:   oklch(68% 0.16 20);
  --p-fur-cat:   oklch(74% 0.14 55);
  --p-fur-cat-d: oklch(63% 0.15 50);
  --p-fur-bun:   oklch(94% 0.02 85);
  --p-fur-bun-d: oklch(85% 0.03 80);
  --p-fur-dog:   oklch(81% 0.10 65);
  --p-fur-dog-d: oklch(70% 0.11 60);
  --p-wall:     oklch(92.5% 0.03 80);
  --p-wall-shade: oklch(88% 0.03 80);
  --p-wain:     oklch(85% 0.04 75);
  --p-wain-d:   oklch(76% 0.05 70);
  --p-wood:     oklch(73% 0.07 70);
  --p-wood-d:   oklch(62% 0.08 65);
  --p-wood-l:   oklch(82% 0.05 75);
  --p-sky:      oklch(89% 0.06 80);
  --p-sky-d:    oklch(82% 0.07 70);
  --p-sun:      oklch(90% 0.09 85);
  --p-rug:      oklch(79% 0.10 40);
  --p-rug-d:    oklch(69% 0.12 35);
  --p-rug-c:    oklch(95% 0.03 90);
  --p-pot:      oklch(71% 0.10 45);
  --p-leaf:     oklch(66% 0.11 145);
  --p-leaf-d:   oklch(54% 0.12 140);
  --p-book1:    oklch(70% 0.10 30);
  --p-book2:    oklch(72% 0.08 200);
  --p-book3:    oklch(78% 0.08 95);
  --p-bowl:     oklch(69% 0.08 70);
  --p-fish:     oklch(78% 0.12 30);
  --p-zzz:      oklch(60% 0.10 230);
  --p-spark:    oklch(87% 0.12 90);
  --p-bubble:   oklch(80% 0.06 220);
  --st-hunger: oklch(66% 0.14 55);
  --st-mood:   oklch(66% 0.16 20);
  --st-energy: var(--accent);
  --st-clean:  oklch(64% 0.09 220);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:var(--fs-body);line-height:1.55;-webkit-font-smoothing:antialiased}
img,svg,canvas{display:block;max-width:100%}
canvas{image-rendering:pixelated}
button{font:inherit;cursor:pointer}
p{text-wrap:pretty}
h1,h2,h3{text-wrap:balance}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.pixnum{font-family:var(--font-pix);font-variant-numeric:tabular-nums;letter-spacing:1px}
.container{max-width:var(--container);margin-inline:auto;padding-inline:var(--gutter)}
.screen{display:none}
.screen.active{display:block}

/* ─── 像素按钮（圆润 + 厚边 + 硬阴影）────────────────── */
.pix-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:3px solid var(--p-line);border-radius:var(--radius-xl);font-family:var(--font-display);letter-spacing:.02em;transition:transform .08s ease,box-shadow .08s ease,background .18s ease,color .18s ease;user-select:none}
.pix-btn:active{transform:translateY(3px)}
.pix-btn:focus-visible{outline:3px solid var(--fg);outline-offset:3px;border-radius:var(--radius-xl)}
.btn-primary{padding:12px 32px;font-size:18px;background:var(--accent);color:var(--surface);border-color:color-mix(in oklch,var(--accent) 55%,black);box-shadow:0 5px 0 color-mix(in oklch,var(--accent) 55%,black)}
.btn-primary:hover{background:color-mix(in oklch,var(--accent) 82%,white);color:color-mix(in oklch,var(--accent) 45%,black);box-shadow:0 6px 0 color-mix(in oklch,var(--accent) 55%,black)}
.btn-ghost{padding:9px 18px;font-size:15px;background:transparent;color:var(--fg);border-color:var(--border)}
.btn-ghost:hover{border-color:var(--fg);background:var(--fg-soft)}
.btn-soft{background:var(--accent-soft);color:color-mix(in oklch,var(--accent) 55%,black);border-color:color-mix(in oklch,var(--accent) 30%,transparent)}
.btn-soft:hover{background:color-mix(in oklch,var(--accent) 20%,transparent)}
.btn-danger{background:color-mix(in oklch,var(--st-mood) 12%,var(--surface));color:var(--st-mood);border-color:color-mix(in oklch,var(--st-mood) 35%,transparent)}
.btn-danger:hover{background:color-mix(in oklch,var(--st-mood) 20%,var(--surface))}
.btn-sm{padding:4px 13px;font-size:13px;border-width:2.5px}
.btn-block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.star::after{content:'✦';font-size:.72em;margin-left:3px;color:var(--p-sun)}

/* ─── 卡片 / 布局 ───────────────────────────────── */
.card{background:color-mix(in oklch,var(--surface) 92%,transparent);border:3px solid var(--border);border-radius:var(--radius-lg);padding:18px;box-shadow:0 4px 0 var(--border)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:920px){.g2,.g3,.g4{grid-template-columns:1fr}}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.stack>*+*{margin-top:12px}
.divider{height:1px;background:var(--border);margin:12px 0}

/* ─── 应用骨架 ─────────────────────────────────── */
#appView{display:none;min-height:100dvh;flex-direction:column}
#appView.active{display:flex}
.scene-stage{position:relative;height:clamp(220px,30vh,300px);flex:0 0 auto;overflow:hidden}
#sceneCanvas{position:absolute;inset:0;width:100%;height:100%}
#scenePet{position:absolute;z-index:2}
.topbar{position:absolute;top:12px;left:0;right:0;z-index:6;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-inline:16px;pointer-events:none}
.topbar>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-size:19px;color:var(--fg);background:color-mix(in oklch,var(--surface) 86%,transparent);backdrop-filter:blur(8px);border:2.5px solid var(--p-line);border-radius:var(--radius-xl);padding:4px 16px 4px 10px;box-shadow:0 3px 0 color-mix(in oklch,var(--p-line) 45%,transparent)}
.brand .dot{width:18px;height:18px;border-radius:50%;background:var(--accent);box-shadow:inset -3px -3px 0 rgba(0,0,0,.15)}
.top-right{display:flex;align-items:center;gap:8px}
.coin-pill{display:inline-flex;align-items:center;gap:6px;background:color-mix(in oklch,var(--surface) 86%,transparent);backdrop-filter:blur(8px);border:2.5px solid var(--p-line);border-radius:var(--radius-xl);padding:4px 14px;font-family:var(--font-pix);font-size:11px;box-shadow:0 3px 0 color-mix(in oklch,var(--p-line) 40%,transparent)}
.coin-pill .c{width:14px;height:14px;border-radius:50%;background:var(--p-sun);box-shadow:inset -2px -2px 0 rgba(0,0,0,.15)}
.user-chip{display:inline-flex;align-items:center;gap:6px;background:color-mix(in oklch,var(--surface) 86%,transparent);backdrop-filter:blur(8px);border:2.5px solid var(--border);border-radius:var(--radius-xl);padding:4px 14px;font-size:13px;box-shadow:0 3px 0 var(--border)}
.user-chip .role{background:var(--accent-soft);color:color-mix(in oklch,var(--accent) 55%,black);border-radius:var(--radius-xl);padding:0 8px;font-size:11px}

/* 场景舞台上的宠物名牌 / 状态 / 气泡 / 倒计时 */
.nameplate{position:absolute;left:50%;transform:translateX(-50%);z-index:5;display:inline-flex;align-items:center;gap:8px;background:color-mix(in oklch,var(--surface) 90%,transparent);backdrop-filter:blur(8px);border:2.5px solid var(--p-line);border-radius:var(--radius-xl);padding:3px 14px 3px 10px;box-shadow:0 3px 0 color-mix(in oklch,var(--p-line) 45%,transparent);white-space:nowrap}
.nameplate .lv{font-family:var(--font-pix);font-size:9px;color:var(--surface);background:var(--accent);border-radius:var(--radius-xl);padding:3px 8px}
.nameplate .nm{font-family:var(--font-display);font-size:16px}
.status-ico{position:absolute;z-index:5;width:22px;height:22px;image-rendering:pixelated}
.speech{position:absolute;left:50%;transform:translateX(-50%);z-index:6;background:var(--surface);border:3px solid var(--p-line);border-radius:16px;padding:7px 16px;font-family:var(--font-display);font-size:15px;box-shadow:0 4px 0 color-mix(in oklch,var(--p-line) 50%,transparent);opacity:0;transition:opacity .25s ease,transform .25s ease;white-space:nowrap;pointer-events:none}
.speech.show{opacity:1;transform:translateX(-50%) translateY(-3px)}
.speech::after{content:'';position:absolute;bottom:-11px;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--p-line)}
.speech::before{content:'';position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);border:4px solid transparent;border-top-color:var(--surface)}
.pm-count{position:absolute;left:50%;transform:translateX(-50%);z-index:6;font-family:var(--font-pix);font-size:17px;color:var(--surface);background:color-mix(in oklch,var(--p-line) 72%,transparent);border:3px solid var(--p-line);border-radius:12px;padding:6px 12px;text-shadow:2px 2px 0 rgba(0,0,0,.35);display:none}

/* ─── 内容区 ───────────────────────────────────── */
.content-wrap{flex:1;min-height:0;position:relative;background:var(--bg);border-top:3px solid var(--border)}
.page{max-width:1080px;margin:0 auto;padding:18px 16px 120px}
.page-head{margin-bottom:14px}
.page-head h2{font-family:var(--font-display);font-size:var(--fs-h2);margin:0}
.page-head .sub{font-size:var(--fs-meta);color:var(--muted);margin-top:2px}
.sub-pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:2.5px solid var(--border);background:var(--surface);border-radius:var(--radius-xl);padding:5px 16px;font-size:13.5px;font-family:var(--font-display);color:var(--fg);transition:.15s}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.active{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:var(--radius-xl);padding:1px 10px;font-size:12px;background:var(--fg-soft);color:var(--muted)}
.badge.b-green{background:color-mix(in oklch,var(--st-energy) 16%,var(--surface));color:color-mix(in oklch,var(--st-energy) 60%,black)}
.badge.b-red{background:color-mix(in oklch,var(--st-mood) 14%,var(--surface));color:var(--st-mood)}
.badge.b-gold{background:color-mix(in oklch,var(--p-sun) 30%,var(--surface));color:color-mix(in oklch,var(--p-sun) 60%,black)}
.badge.b-pink{background:color-mix(in oklch,var(--p-pink) 24%,var(--surface));color:color-mix(in oklch,var(--p-pink) 60%,black)}
.badge.b-orange{background:color-mix(in oklch,var(--p-fur-cat) 22%,var(--surface));color:color-mix(in oklch,var(--p-fur-cat) 60%,black)}

/* 表单 */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;color:var(--muted);font-weight:600}
.input,select.input,textarea.input{width:100%;padding:9px 13px;border:2.5px solid var(--border);border-radius:12px;background:var(--surface);color:var(--fg);font-size:14px;transition:border-color .15s}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.input{min-height:70px;resize:vertical}
.form-card{max-width:420px;margin:0 auto}

/* 表格 / 列表 */
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:2px solid var(--border);white-space:nowrap}
.table td{padding:9px 10px;border-bottom:1.5px solid var(--border);vertical-align:middle}
.table tbody tr:hover{background:var(--fg-soft)}
.table .ops{display:flex;gap:6px;flex-wrap:wrap}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1.5px solid var(--border)}
.list-row:last-child{border-bottom:0}

/* 统计 / 状态条 */
.stat{background:var(--surface);border:2.5px solid var(--border);border-radius:var(--radius-lg);box-shadow:0 3px 0 var(--border);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:23px;font-weight:800;font-family:var(--font-display);line-height:1.1}
.stat .v small{font-size:12px;color:var(--muted);font-family:var(--font-body)}
.stat .bar{height:9px;border-radius:var(--radius-xl);background:var(--border);border:1.5px solid color-mix(in oklch,var(--p-line) 40%,var(--surface));overflow:hidden;margin-top:6px}
.stat .bar i{display:block;height:100%;border-radius:var(--radius-xl);background:var(--accent);transition:width .5s}
.bar-chart{display:flex;align-items:flex-end;gap:8px;height:110px;padding-top:8px}
.bar-chart .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bar-chart .b i{width:100%;max-width:32px;border-radius:6px 6px 0 0;background:var(--accent);min-height:3px}
.bar-chart .b span{font-size:11px;color:var(--muted)}

/* 宠物 */
.pet-svg{width:100%;height:auto;image-rendering:pixelated}
.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2.5px solid var(--border);background:var(--surface);image-rendering:pixelated}
.avatar-lg{width:64px;height:64px}
.pet-card-pix{background:var(--surface);border:3px solid var(--border);border-radius:var(--radius-lg);box-shadow:0 4px 0 var(--border);padding:16px;text-align:center;transition:transform .12s,border-color .15s}
.pet-card-pix:hover{transform:translateY(-2px)}
.pet-card-pix .ico{width:86px;margin:0 auto}
.pet-card-pix .nm{font-weight:700;margin-top:6px}
.shop-card{background:var(--surface);border:2.5px solid var(--border);border-radius:var(--radius-lg);padding:13px;display:flex;flex-direction:column;gap:8px;position:relative;transition:transform .15s,box-shadow .15s}
.shop-card:hover{transform:translateY(-2px);box-shadow:0 4px 0 var(--border)}
.shop-card .ico{width:58px;height:58px;margin:0 auto;border-radius:12px;background:var(--fg-soft);display:grid;place-items:center;image-rendering:pixelated}
.shop-card .nm{font-weight:700;font-size:13.5px}
.shop-card .ds{font-size:12px;color:var(--muted);min-height:30px}
.shop-card .lock{position:absolute;top:9px;right:9px}
.egg{width:92px;height:106px;margin:0 auto;cursor:pointer;animation:eggFloat 2.2s ease-in-out infinite}
@keyframes eggFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* 对话 */
.chat-box{background:var(--surface);border:3px solid var(--border);border-radius:var(--radius-lg);padding:14px;height:400px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.msg{max-width:74%;padding:8px 13px;border-radius:14px;font-size:13.5px;line-height:1.5;word-break:break-word}
.msg.pet{align-self:flex-start;background:var(--fg-soft);border:1.5px solid var(--border);border-bottom-left-radius:4px;display:flex;gap:8px;align-items:flex-start}
.msg.pet .avatar{width:32px;height:32px;flex:0 0 auto}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--surface);border-bottom-right-radius:4px}
.msg .t{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.msg.me .t{color:color-mix(in oklch,var(--surface) 78%,transparent)}
.msg-date{align-self:center;font-size:11.5px;color:var(--muted);background:var(--fg-soft);border-radius:var(--radius-xl);padding:2px 10px}

/* 番茄钟 */
.timer-num{font-family:var(--font-pix);font-size:46px;line-height:1;text-align:center;color:var(--fg)}
.timer-num.warn{color:var(--st-mood)}
.pixel-big{font-family:var(--font-pix)}

/* ─── 场景轨道（拉小球换场景）──────────────────────── */
.rail{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:30;width:min(94vw,680px);height:64px;background:color-mix(in oklch,var(--p-wood) 82%,var(--surface));border:3px solid var(--p-line);border-radius:var(--radius-xl);box-shadow:0 5px 0 color-mix(in oklch,var(--p-line) 55%,transparent),inset 0 3px 0 rgba(255,255,255,.28);touch-action:none}
.rail .slots{position:absolute;inset:0;display:flex;align-items:center;padding:0 6px}
.rail-slot{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:0;color:color-mix(in oklch,var(--p-line) 82%,var(--surface));font-size:10.5px;font-family:var(--font-display);border-radius:var(--radius-xl);transition:color .15s}
.rail-slot .si{width:24px;height:24px;image-rendering:pixelated}
.rail-slot.on{color:var(--surface);text-shadow:0 1px 0 rgba(0,0,0,.25)}
.rail-ball{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;background:var(--accent);border:3px solid var(--p-line);box-shadow:0 4px 0 color-mix(in oklch,var(--p-line) 60%,transparent),inset 5px 5px 0 rgba(255,255,255,.28),inset -5px -6px 0 rgba(0,0,0,.12);display:grid;place-items:center;z-index:2;pointer-events:none;transition:left .25s cubic-bezier(.34,1.56,.64,1)}
.rail-ball .bi{width:26px;height:26px;image-rendering:pixelated}
.rail-ball.wiggle{animation:ballWiggle .3s ease}
@keyframes ballWiggle{0%,100%{transform:translateY(-50%) rotate(0)}25%{transform:translateY(-50%) rotate(-8deg)}75%{transform:translateY(-50%) rotate(8deg)}}

/* ─── 悬浮宠物小球 ─────────────────────────────── */
.float-pet{position:fixed;right:16px;bottom:92px;z-index:50;width:76px;height:76px}
.float-pet .face{width:76px;height:76px;border-radius:50%;background:var(--surface);border:3px solid var(--p-line);box-shadow:0 6px 0 color-mix(in oklch,var(--p-line) 50%,transparent),0 14px 26px -10px var(--p-line);display:grid;place-items:center;cursor:grab;position:relative}
.float-pet .face img{width:62px;height:62px;image-rendering:pixelated}
.float-pet .face.bounce{animation:fpBounce .5s ease}
.float-pet .face.spin{animation:fpSpin .6s ease}
.float-pet .face.squish{animation:fpSquish .4s ease}
@keyframes fpBounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-14px)}60%{transform:translateY(0)}}
@keyframes fpSpin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
@keyframes fpSquish{0%,100%{transform:scale(1,1)}40%{transform:scale(1.18,.82)}}

<script>
'use strict';
/* ═══════════════ 基础工具 ═══════════════ */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg, type = 'info', ms = 2600) {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), ms);
}
let modalCb = null;
function confirmBox(title, body, cb) {
  $('#modalTitle').textContent = title;
  $('#modalBody').innerHTML = body;
  $('#modalMask').classList.add('show');
  modalCb = cb;
}
$('#modalMask').addEventListener('click', e => {
  const b = e.target.closest('[data-modal]');
  if (!b) return;
  $('#modalMask').classList.remove('show');
  if (b.dataset.modal === 'ok' && modalCb) modalCb();
  modalCb = null;
});
function say(msg, ms = 2600) {
  const sp = $('#speech');
  sp.textContent = msg;
  sp.classList.add('show');
  clearTimeout(sayTimer);
  sayTimer = setTimeout(() => sp.classList.remove('show'), ms);
}
let sayTimer = null;

/* ═══════════════ 像素引擎（沿用 v1） ═══════════════ */
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const C = {};
['line','ink','cream','pink','heart','fur-cat','fur-cat-d','fur-bun','fur-bun-d','fur-dog','fur-dog-d',
 'wall','wall-shade','wain','wain-d','wood','wood-d','wood-l','sky','sky-d','sun','rug','rug-d','rug-c',
 'pot','leaf','leaf-d','book1','book2','book3','bowl','fish','zzz','spark','bubble']
  .forEach(k => { C[k] = cssVar('--p-' + k); C[k.replace(/-/g, '_')] = cssVar('--p-' + k); });

function mulberry32(a) { return function() {
  a |= 0; a = a + 0x6D2B79F5 | 0;
  let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}; }
const rnd = mulberry32(20260701);

function gridToCanvas(grid, pal, blink) {
  const w = Math.max(...grid.map(r => r.length));
  const h = grid.length;
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const cx = cv.getContext('2d');
  for (let y = 0; y < h; y++) {
    const row = grid[y];
    for (let x = 0; x < row.length; x++) {
      const ch = row[x];
      if (ch === '.') continue;
      if (ch === 'I' && blink) { cx.fillStyle = C[pal.O]; cx.fillRect(x, y, 2, 1); continue; }
      cx.fillStyle = C[pal[ch] || pal.O];
      cx.fillRect(x, y, 1, 1);
    }
  }
  // 裁剪透明边距
  const data = cx.getImageData(0, 0, w, h).data;
  let minX = w, minY = h, maxX = -1, maxY = -1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (data[(y * w + x) * 4 + 3] > 0) {
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (y < minY) minY = y; if (y > maxY) maxY = y;
    }
  }
  if (maxX < 0) return cv;
  const tw = maxX - minX + 1, th = maxY - minY + 1;
  const out = document.createElement('canvas');
  out.width = tw; out.height = th;
  out.getContext('2d').drawImage(cv, minX, minY, tw, th, 0, 0, tw, th);
  return out;
}

/* ═══════════════ 13 种像素宠物（正面 Q 版） ═══════════════ */
const SPECIES = {
  RAT:{n:'鼠',c:'#b8a494',e:'round',whisk:1},
  OX:{n:'牛',c:'#c9a06c',e:'horn'},
  TIGER:{n:'虎',c:'#f0a054',e:'point',stripe:1},
  RABBIT:{n:'兔',c:'#f2ebe0',e:'long'},
  DRAGON:{n:'龙',c:'#7fbf9e',e:'horn',wing:1},
  SNAKE:{n:'蛇',c:'#93c47d',e:'none',coil:1},
  HORSE:{n:'马',c:'#b98a5e',e:'horse'},
  SHEEP:{n:'羊',c:'#efe9dc',e:'flop',wool:1},
  MONKEY:{n:'猴',c:'#c98d5e',e:'round',tail:1},
  ROOSTER:{n:'鸡',c:'#e98a5e',e:'comb'},
  DOG:{n:'狗',c:'#c9a06c',e:'flop'},
  PIG:{n:'猪',c:'#f2a2b5',e:'round',snout:1},
  CAT:{n:'猫',c:'#f0a054',e:'point'}
};
const BODY = [
  '..OFFFOOOFFFO..',
  '..OFFFFFFFFO...',
  '.OFFFFFFFFFFO..',
  '.OFFFFFFFFFFO..',
  '.OFIIFFFFFFIIFO.',
  '.OFFFFFNNFFFFFO.',
  '.OFFFFFFFFFFFFO.',
  '..OFFFFFFFFO....',
  '..OFO....OFO....',
  '..L......L......'
];
const EARS = {
  point:['....OO..OO....','...OEO..OEO...','...OEO..OEO...','...OFFO.OFFO...'],
  round:['..OO......OO..','.OEEO....OEEO.','.OEEO....OEEO.','..OFFO..OFFO..'],
  long: ['.O..........O.','OEO........OEO','OEO........OEO','OEO........OEO','.OEO......OEO.','..OFFO..OFFO..'],
  flop: ['OO............OO','OEO..........OEO','OEO..........OEO','OFF..........FFO'],
  horn: ['O..............O','.O............O.','..OEO....OEO...','..OFFO..OFFO...'],
  horse:['O..............O','.OEO........OEO.','.OEO........OEO.','..OFFO..OFFO...'],
  comb: ['...O...O..O.....','..OOO.OOO.OO....','..OEO...OEO....','..OFFO..OFFO...'],
  none: []
};
function speciesGrid(code) {
  const S = SPECIES[code];
  const earRows = (EARS[S.e] || []).map(r => r.split(''));
  const bodyRows = BODY.map(r => r.split(''));
  const base = earRows.length;
  const at = (i, j, ch) => { const row = bodyRows[i]; if (row && j >= 0 && j < row.length) row[j] = ch; };
  if (S.whisk) { at(4, 1, 'W'); at(4, 14, 'W'); at(5, 0, 'W'); at(5, 15, 'W'); }
  if (S.stripe) { at(3, 3, 'D'); at(3, 12, 'D'); at(4, 3, 'D'); at(4, 12, 'D'); }
  if (S.snout) { at(3, 6, 'P'); at(3, 7, 'P'); at(3, 8, 'P'); at(3, 9, 'P'); at(4, 6, 'P'); at(4, 7, 'P'); at(4, 8, 'P'); at(4, 9, 'P'); }
  if (S.wing) { at(2, 0, 'W'); at(2, 1, 'W'); at(2, 15, 'W'); at(1, 15, 'W'); }
  if (S.coil) { bodyRows.push('..OOOOOOOOOO....'.split('')); bodyRows.push('..OOOOOOOOOO....'.split('')); }
  let grid = earRows.concat(bodyRows);
  if (S.wool) grid = ['..O......O......'.split(''), '...O....O.......'.split('')].concat(grid);
  return grid;
}
function addBow(grid) {
  return ['...PP..PP.....'.split(''), '..PPPPPPPP....'.split(''), '....PP..PP....'.split('')].concat(grid);
}
const PET_CACHE = {};
function petFrames(code, sex) {
  const key = code + '_' + sex;
  if (PET_CACHE[key]) return PET_CACHE[key];
  const pal = {
    O:'line', F:'fur-' + ({RAT:'bun',OX:'bun',TIGER:'cat',RABBIT:'bun',DRAGON:'bun',SNAKE:'bun',HORSE:'dog',SHEEP:'bun',MONKEY:'dog',ROOSTER:'cat',DOG:'dog',PIG:'bun',CAT:'cat'}[code]), L:'cream', E:'pink', I:'ink', N:'ink', P:'pink', D:'line', W:'bun'
  };
  let grid = speciesGrid(code);
  if (sex === 'FEMALE') grid = addBow(grid);
  PET_CACHE[key] = {
    normal: gridToCanvas(grid, pal, false),
    blink: gridToCanvas(grid, pal, true),
    w: Math.max(...grid.map(r => r.length)),
    h: grid.length
  };
  return PET_CACHE[key];
}
function petImg(code, sex, cls = 'pet-svg', w = 96) {
  const f = petFrames(code, sex);
  const file = `assets/${code}_${sex}.gif`;
  const uri = f.normal.toDataURL();
  return `<img class="${cls}" width="${w}" height="${w}" src="${file}" alt="${(SPECIES[code]||{}).n || ''}${sex==='FEMALE'?'♀':'♂'}" onerror="this.onerror=null;this.src='${uri}'">`;
}
function petCodeName(code) { return (SPECIES[code] || { n: code }).n; }

/* ═══════════════ 场景绘制（小屋/书房/商店/花园/阁楼/设置） ═══════════════ */
function drawScene(type) {
  const canvas = type === 'auth' ? $('#authScene') : $('#sceneCanvas');
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (!w || !h) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = w * dpr; canvas.height = h * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
  const rect = (x, y, ww, hh, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(ww), Math.round(hh)); };
  const garden = type === 'garden';
  const wallH = garden ? h * 0.5 : h * 0.52, floorY = garden ? h * 0.72 : h * 0.68, floorH = h - floorY;

  /* 背景 */
  if (garden) {
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#bfe3f2'); g.addColorStop(0.7, '#dff0f7'); g.addColorStop(1, '#cfe9c4');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    rect(0, floorY, w, floorH, '#a8d69a');
    for (let x = 0; x < w; x += 14) if (rnd() < 0.3) rect(x, floorY + rnd() * floorH, 2, 2, '#8fc47f');
    // 云朵
    const cloud = (cx, cy) => { rect(cx, cy, 26, 8, '#fff'); rect(cx + 6, cy - 6, 14, 6, '#fff'); rect(cx - 8, cy + 4, 42, 6, '#fff'); };
    cloud(w * 0.12, h * 0.14); cloud(w * 0.62, h * 0.09); cloud(w * 0.85, h * 0.2);
    rect(w * 0.3, h * 0.08, 14, 14, '#ffd76e'); // 太阳
    // 栅栏
    for (let x = 0; x < w; x += 40) rect(x, floorY - 16, 6, 16, '#c8a16b');
    rect(0, floorY - 6, w, 4, '#b98a5e');
    // 树
    const tree = (tx) => { rect(tx, floorY - 26, 12, 26, '#9c6b3f'); rect(tx - 12, floorY - 52, 36, 28, '#6fae63'); rect(tx - 6, floorY - 60, 24, 12, '#6fae63'); };
    tree(w * 0.08); tree(w * 0.94);
    // 花
    for (let i = 0; i < 10; i++) { const fx = w * (0.12 + i * 0.08); rect(fx, floorY + 6, 4, 8, '#8fc47f'); rect(fx, floorY, 4, 4, ['#f2a2b5','#ffd76e','#f0a054','#fff'][i % 4]); }
  } else {
    rect(0, 0, w, wallH, C.wall);
    for (let x = 0; x < w; x += 26) if (rnd() < 0.25) rect(x, rnd() * wallH, 1, 1, C['wall-shade']);
    rect(0, wallH, w, floorY - wallH, C.wain);
    for (let x = 14; x < w; x += 92) rect(x, wallH + 3, 2, floorY - wallH - 6, C.wain_d);
    rect(0, floorY - 4, w, 4, C.wain_d);
    const plankH = Math.max(14, floorH / 5);
    const tones = [C.wood, C.wood_l, C.wood, C.wood_d, C.wood];
    for (let i = 0; i < 5; i++) {
      const y = floorY + i * plankH;
      rect(0, y, w, plankH, tones[i]);
      for (let x = 0; x < w; x += 9) if (rnd() < 0.2) rect(x, y + 3, 3, 1, i % 2 ? C.wood_l : C.wood_d);
      rect(0, y, w, 1, C.wood_d);
    }
    // 圆窗
    const winCX = w * 0.14, winCY = wallH * 0.4, winR = Math.min(h, w) * 0.1;
    rect(winCX - winR * 0.8, winCY + winR * 0.6, winR * 1.6, 6, C.wood_d);
    ctx.fillStyle = C.sky_d; ctx.beginPath(); ctx.arc(winCX, winCY - winR * 0.6, winR * 0.6, Math.PI, 0); ctx.rect(winCX - winR * 0.6, winCY - winR * 0.6, winR * 1.2, winR * 0.8); ctx.fill();
    ctx.fillStyle = C.sky; ctx.fillRect(winCX - winR * 0.45, winCY - winR * 0.45, winR * 0.9, winR * 0.7);

async function api(method, path, body) {
  if (demo) return mockApi(method, path, body);
  /* ── 请求体改写(前端字段 → 后端字段) ── */
  if (body && typeof body === 'object') {
    if (path.indexOf('/api/shop/feed') >= 0 && body.id !== undefined) body = { itemId: body.id };
    else if (path.indexOf('/api/shop/buy') >= 0 && body.id !== undefined) body = { itemId: body.id };
    else if (path.indexOf('/api/breeding/request') >= 0 && body.id !== undefined) body = { fatherPetId: body.id };
    else if (path.indexOf('/api/inbox/message') >= 0) body = { receiverId: body.to, content: body.text };
    else if (path.indexOf('/api/pet/draw') >= 0) body = { petName: body.name, typeCode: body.code };
    else if (path.indexOf('/api/settings/allow-breeding') >= 0) body = { value: !!body.allowBreeding };
    else if (path.indexOf('/api/settings/app-monitor') >= 0) body = { value: !!body.appMonitor };
    else if (path.indexOf('/api/reports') >= 0) body = { targetUserId: body.target, content: body.text || body.chat || '举报' };
    else if (path.indexOf('/api/keys') >= 0 && method === 'POST') body = { provider: provCode(body.provider), key: body.key, baseUrl: body.address, modelName: body.model };
    else if (path.indexOf('/api/admin/play-modes') >= 0 && method === 'POST') body = { name: body.name, icon: body.emoji || '', image: '', mood: body.mood, hunger: body.hunger, exp: body.xp };
    else if (path.indexOf('/api/admin/shop-items') >= 0 && method === 'POST') body = { itemName: body.name, itemType: body.type, species: zhCode(body.species), image: body.icon || '', price: body.price, hungerRestore: body.hunger, moodRestore: body.mood, minLevel: body.unlockLevel || 1, enabled: 1 };
    else if (path.indexOf('/api/admin/shop-items/') >= 0 && method === 'PUT' && body.listed !== undefined) body = { enabled: body.listed ? 1 : 0 };
    else if (path.indexOf('/api/schedule') >= 0 && (method === 'POST' || method === 'PUT')) {
      if (method === 'PUT' && path === '/api/schedule' && body.id) { path = '/api/schedule/' + body.id; }
      body = schedBody(body);
    }
  }
  let res;
  try {
    res = await fetch(API_BASE + path, {
      method,
      headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
      body: body ? JSON.stringify(body) : undefined
    });
  } catch (e) { enterDemo(); return mockApi(method, path, body); }
  let json;
  try { json = await res.json(); } catch (e) { json = { code: -1, msg: '响应解析失败' }; }
  if (json.code !== 200) throw new Error(json.msg || '请求失败');
  console.log('[api]', method, path);
  return shimData(method, path, json.data, body);
}

function authForm(kind) {

function renderAuth(kind = 'login') {
  $$('[data-auth-tab]').forEach(b => b.classList.toggle('active', b.dataset.authTab === kind));

}
function setSession(t, u) {
  token = t; user = u;
  try { localStorage.setItem('dp_token', t); localStorage.setItem('dp_user', JSON.stringify(u)); } catch (e) {}
  /* 融合:同步给悬浮宠物窗与主进程推送 */
  try { localStorage.setItem('pet_token', t); localStorage.setItem('pet_user', JSON.stringify(u)); } catch (e2) {}
  if (window.petAPI && window.petAPI.setToken) window.petAPI.setToken(t);
  $('#authView').style.display = 'none';
  $('#appView').style.display = 'flex';
  $('#appView').classList.add('active');
  buildTopbar();
  enterScene('home');
  initFloatPet();
  greeting();
  toast('欢迎回来，' + (u.nick || u.username));
}
function logout() {
  token = ''; user = null;
  try { localStorage.removeItem('dp_token'); localStorage.removeItem('dp_user'); localStorage.removeItem('pet_token'); localStorage.removeItem('pet_user'); } catch (e) {}
  if (window.petAPI && window.petAPI.setToken) window.petAPI.setToken(null);
  $('#appView').style.display = 'none';
  $('#authView').style.display = 'block';
  renderAuth('login');
}
function greeting() {
  let last = '';
  try { last = localStorage.getItem('dp_greet') || ''; } catch (e) {}
  const today = new Date().toDateString();
  if (last !== today) {
    try { localStorage.setItem('dp_greet', today); } catch (e) {}
    setTimeout(() => say('早上好呀！今天也一起加油～', 3200), 600);
  }
}

function enterScene(id, opts = {}) {
  curScene = id;
  const pages = SCENE_PAGES[id];
  if (opts.page) curPage = opts.page;
  else if (!pages.some(p => p[0] === curPage)) curPage = pages[0][0];
  // 管理后台入口对所有人可见(非管理员点进去会看到登录提示)
  if (id === 'settings' && !SCENE_PAGES.settings.some(p => p[0] === 'admin')) {
    SCENE_PAGES.settings.push(['admin', '管理后台']);
  }
  positionBall();
  drawScene(SCENES.find(s => s.id === id).scene);
  renderSubPills();
  showPage(curPage);

  layoutScenePet();
}
function renderSubPills() {
  const pages = SCENE_PAGES[curScene];
  $('#subPills').innerHTML = pages.map(([k, n]) => {

    return `<button class="chip ${k === curPage ? 'active' : ''}" data-page="${k}">${n}${badge}</button>`;
  }).join('');
}
function showPage(id) {
  curPage = id;

    pet: renderPet, schedule: renderSchedule, pomodoro: renderPomodoro, shop: renderShop, bag: renderBag,
    breed: renderBreeding, hatch: renderHatch, friends: renderFriends, inbox: renderInbox,
    grave: renderGrave, desktop: renderDesktop, camera: renderCamera, chat: renderChat,
    settings: renderSettings, admin: renderAdmin

}

function glyphData(name, color) {
  const key = name + '_' + (color || 'd');
  if (glyphCache[key]) return glyphCache[key];
  const g = GLYPHS[name] || GLYPHS.star;
  const w = g[0].length, h = g.length;
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const cx = cv.getContext('2d');
  cx.fillStyle = color || '#4a3a2a';
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (g[y][x] === 'O') cx.fillRect(x, y, 1, 1);
  glyphCache[key] = cv.toDataURL();
  return glyphCache[key];
}
const glyphCache = {};
function petStatusIco() {
  if (!MOCK.pet) return null;
  if (MOCK.pm && !MOCK.pm.done) return { g: 'clock', c: '#4a8fb0', label: '学习中' };
  if (MOCK.hunger <= 30) return { g: 'fish', c: '#c96a3a', label: '饿了' };
  if (MOCK.mood <= 35) return { g: 'zzz', c: '#7a6a5a', label: '无聊' };
  return { g: 'heart', c: '#e06080', label: '开心' };
}

          <div class="field" style="width:140px"><select class="input" id="pmLen"><option value="30">30 分钟</option><option value="60">60 分钟</option><option value="custom">自定义</option></select></div>
          <div class="field" style="width:100px;display:none" id="pmCustom"><input class="input num" id="pmCustomMin" type="number" min="1" max="180" placeholder="分钟"></div>
          <button class="btn btn-primary star" data-act="pm-start">▶ 开始专注</button>
        </div>
      </div>
      <div class="card">
        <h3 style="font-family:var(--font-display);font-size:16px;margin-bottom:10px">专注记录</h3>
        <div class="row" style="margin-bottom:10px">
          <input class="input" id="recFrom" type="date" style="max-width:140px"><span style="color:var(--muted)">至</span>
          <input class="input" id="recTo" type="date" style="max-width:140px">
          <select class="input" id="recSort" style="max-width:150px"><option value="new">新 → 旧</option><option value="old">旧 → 新</option><option value="mins">分钟多 → 少</option></select>
        </div>
        <div id="recList"></div>
      </div>
    </div>`;
  loadRecords();
  if (MOCK.pm && !MOCK.pm.done) renderPmRunning();
}
function loadRecords() {
  api('GET', '/api/pomodoro/my').then(rs => {
    const from = ($('#recFrom').value || '').slice(0, 10), to = ($('#recTo').value || '').slice(0, 10);
    const sort = $('#recSort').value;
    let list = rs.filter(r => (!from || r.date >= from) && (!to || r.date <= to));
    if (sort === 'old') list = list.slice().reverse();
    if (sort === 'mins') list = list.slice().sort((a, b) => b.minutes - a.minutes);
    $('#recList').innerHTML = `<table class="table"><thead><tr><th>日期</th><th>时长</th><th>状态</th></tr></thead><tbody>` +
      list.map(r => `<tr><td>${r.date}</td><td class="num">${r.minutes} 分钟</td><td>${r.done ? '<span class="badge b-green">已完成</span>' : '<span class="badge">已放弃</span>'}</td></tr>`).join('') +
      `</tbody></table>` || '<div class="empty">暂无记录</div>';
  });
}
let pmTick = null;
function renderPmRunning() {
  const ctl = $('#pmCtl');
  if (!ctl) return;
  const pm = MOCK.pm;
  const mm = Math.floor(pm.remain / 60), ss = pm.remain % 60;
  $('#pmNum').textContent = String(mm).padStart(2, '0') + ':' + String(ss).padStart(2, '0');
  $('#pmNum').classList.toggle('warn', pm.remain <= 300);
  $('#pmState').textContent = pm.paused ? '已暂停 · 宠物静音中' : '专注中 · 宠物静音中';
  ctl.innerHTML = `
    <button class="btn btn-ghost" data-act="pm-pause" ${pm.pauses >= 2 ? 'disabled' : ''}>⏸ 暂停(${2 - pm.pauses})</button>
    <button class="btn btn-ghost" data-act="pm-resume" ${pm.paused ? '' : 'disabled'}>▶️ 恢复</button>
    <button class="btn btn-primary" data-act="pm-complete">✅ 完成</button>
    <button class="btn btn-danger" data-act="pm-abandon">🚫 放弃</button>`;
  const c = $('#pmCount');
  c.textContent = mm + ':' + String(ss).padStart(2, '0');
  c.style.display = 'block';
}
function startPmTick() {
  stopPmTick();
  pmTick = setInterval(() => {
    if (MOCK.pm && !MOCK.pm.paused && !MOCK.pm.done) {
      MOCK.pm.remain--;
      if (MOCK.pm.remain <= 0) MOCK.pm.remain = 0;
      renderPmRunning();
    }
  }, 1000);
}
function stopPmTick() { if (pmTick) { clearInterval(pmTick); pmTick = null; } $('#pmCount').style.display = 'none'; }

let camStream = null;
function camToggle() {
  const v = $('#camVideo');
  if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; v.style.display = 'none'; $('#camPh').style.display = 'none'; return; }
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    navigator.mediaDevices.getUserMedia({ video: true }).then(s => {
      camStream = s; v.srcObject = s; v.style.display = 'block';
      toast('摄像头已开启', 'ok');
    }).catch(() => {
      $('#camPh').style.display = 'block';
      $('#camPh').innerHTML = '<div style="width:100%;height:100%;display:grid;place-items:center;color:#fff;font-size:13px">无法访问摄像头（演示占位）</div>';

}

/* ═══════════════ 悬浮宠物小球（情境化交互） ═══════════════ */
function initFloatPet() {
  const fp = $('#floatPet');
  fp.style.display = 'block';
  refreshFloatFace();

  floatDrag(fp);
}
function refreshFloatFace() {
  const pet = MOCK.pet || { code: 'CAT', sex: 'MALE' };
  $('#fpFace').innerHTML = petImg(pet.code, pet.sex, 'pet-svg', 62);
  api('GET', '/api/pet/my').then(p => {
    if (p && p.hasPet) {
      MOCK.pet = p; MOCK.hunger = p.hunger; MOCK.mood = p.mood; MOCK.coins = p.coins;
      $('#fpFace').innerHTML = petImg(p.code, p.sex, 'pet-svg', 62);
      refreshStatus();
    }
  }).catch(() => {});
}
let fpBubbleTimer = null;
function fpBubble(text, sticky) {
  const b = $('#fpBubble');
  if (text === null) { b.style.display = 'block'; b.textContent = ''; return; }
  b.textContent = text;
  b.classList.add('show');
  clearTimeout(fpBubbleTimer);
  if (!sticky) fpBubbleTimer = setTimeout(() => b.classList.remove('show'), 2600);
}
function floatDrag(fp) {
  let sx = 0, sy = 0, ox = 0, oy = 0, down = false, moved = false;
  const face = $('#fpFace');
  face.addEventListener('pointerdown', e => {
    down = true; moved = false; sx = e.clientX; sy = e.clientY;
    const r = fp.getBoundingClientRect(); ox = r.left; oy = r.top;
    face.style.cursor = 'grabbing';
  });
  window.addEventListener('pointermove', e => {
    if (!down) return;
    if (Math.abs(e.clientX - sx) + Math.abs(e.clientY - sy) > 4) moved = true;
    fp.style.left = (ox + e.clientX - sx) + 'px';
    fp.style.top = (oy + e.clientY - sy) + 'px';
    fp.style.right = 'auto'; fp.style.bottom = 'auto';
  });
  window.addEventListener('pointerup', () => { down = false; face.style.cursor = 'grab'; });
  face.addEventListener('click', e => {
    if (moved) return;   // 拖拽不算点击
    fpReaction();
  });
  face.addEventListener('dblclick', e => { if (!moved) { enterScene('home'); toast('已打开主控窗口', 'info'); } });
  face.addEventListener('contextmenu', e => {
    e.preventDefault();
    const items = [['🍖 喂食', () => quickFeed()], ['🎮 玩耍', () => fpPlay()], ['🙈 隐藏', () => { $('#floatPet').style.display = 'none'; toast('小球已隐藏，可从设置唤起', 'info'); }]];
    $('#fpMenu').innerHTML = items.map(([t, fn], i) => `<button data-fpi="${i}">${t}</button>`).join('');
    $('#fpMenu').classList.add('show');
    if (fpMenuClose) document.removeEventListener('click', fpMenuClose);
    fpMenuClose = () => { $('#fpMenu').classList.remove('show'); document.removeEventListener('click', fpMenuClose); fpMenuClose = null; };
    setTimeout(() => document.addEventListener('click', fpMenuClose), 0);
  });
  $('#fpMenu').addEventListener('click', e => {
    const b = e.target.closest('[data-fpi]');
    if (!b) return;
    const i = +b.dataset.fpi;
    $('#fpMenu').classList.remove('show');
    [[() => quickFeed()], [() => fpPlay()], [() => $('#floatPet').style.display = 'none']][i][0]();
  });
}
function fpReaction() {
  const acts = ['bounce', 'spin', 'squish'];
  const cls = acts[Math.floor(Math.random() * acts.length)];
  $('#fpFace').classList.add(cls);
  setTimeout(() => $('#fpFace').classList.remove(cls), 600);
  const moods = ['呼噜呼噜～', '嘿嘿，你终于来啦！', '陪我玩嘛～', '今天也要加油哦！'];
  fpBubble(moods[Math.floor(Math.random() * moods.length)], false);
}
function quickFeed() {
  api('GET', '/api/shop/inventory').then(inv => {
    if (!inv.length) { toast('背包没有食物，去商店买一点吧', 'info'); return; }
    return api('POST', '/api/shop/feed', { id: inv[0].id });
  }).then(d => {
    if (!d) return;
    const delta = Math.max(0, d.hunger - MOCK.hunger);
    MOCK.hunger = d.hunger;
    toast('喂食成功，饥饿 +' + delta, 'ok');
    fpBubble('真香！谢谢你～', false);
    refreshStatus();
  }).catch(e => toast(e.message, 'err'));
}
function fpPlay() {
  api('GET', '/api/pet/play-modes').then(modes => {
    const m = modes[Math.floor(Math.random() * modes.length)];
    return api('POST', '/api/pet/play', { mode: m });
  }).then(d => {
    MOCK.mood = d.mood; MOCK.hunger = d.hunger; MOCK.xp = d.xp;
    fpBubble('玩' + '得真开心～', false);
    refreshStatus();
  }).catch(() => {});
}
function doPlay(mode) {
  api('POST', '/api/pet/play', { mode }).then(d => {
    MOCK.hunger = d.hunger; MOCK.mood = d.mood; MOCK.xp = d.xp;

}
function refreshStatus() {

/* 拉小球换场景 */
let ballDragging = false, ballStartX = 0, ballStartLeft = 0;
function moveBallTo(idx) {
  curScene = SCENES[idx].id;
  const x = railSlotX(idx) - $('#railBall').offsetWidth / 2;
  $('#railBall').style.left = x + 'px';
  enterScene(curScene);
  $('#railBall').classList.add('wiggle');
  setTimeout(() => $('#railBall').classList.remove('wiggle'), 320);
}
(function initRail() {
  const rail = $('#rail'), ball = $('#railBall');
  rail.addEventListener('pointerdown', e => {
    if (e.target.closest('.rail-slot')) return;
    ballDragging = true;
    ballStartX = e.clientX;
    ballStartLeft = ball.offsetLeft;
    rail.setPointerCapture && rail.setPointerCapture(e.pointerId);
  });
  rail.addEventListener('pointermove', e => {
    if (!ballDragging) return;
    const railW = rail.clientWidth, ballW = ball.offsetWidth;
    const min = 2, max = railW - ballW - 2;
    const nLeft = Math.max(min, Math.min(max, ballStartLeft + (e.clientX - ballStartX)));
    ball.style.left = nLeft + 'px';
    // 高亮最近槽
    const idx = Math.round(nLeft / (railW / SCENES.length));
    $$('#railSlots .rail-slot').forEach((el, i) => el.classList.toggle('on', i === idx));
  });
  const end = () => {
    if (!ballDragging) return;
    ballDragging = false;
    const railW = rail.clientWidth, ballW = ball.offsetWidth;
    const nLeft = ball.offsetLeft;
    const idx = Math.max(0, Math.min(SCENES.length - 1, Math.round(nLeft / (railW / SCENES.length))));
    moveBallTo(idx);
  };
  rail.addEventListener('pointerup', end);
  rail.addEventListener('pointercancel', end);
})();

/* 主循环：场景宠物动画 + 状态 */
function mainLoop(t) {
  petPhase += 1;
  if (petPhase % 120 === 0) petBlinkT = 200;   // 每 2 秒眨眼
  if (petBlinkT > 0) petBlinkT -= 16.7;
  if (MOCK.pet && $('#appView').classList.contains('active')) {
    drawScenePet(t);
    const st = petStatusIco();
    const el = $('#statusIco');
    if (st && el.src !== glyphData(st.g, st.c)) { el.src = glyphData(st.g, st.c); el.style.display = 'block'; }
  }
  requestAnimationFrame(mainLoop);
}
setInterval(() => {
  if (!MOCK.pet) return;
  // 状态驱动：饿/无聊 → 主动表达
  if (MOCK.hunger <= 30 && Math.random() < 0.4) { fpBubble('我饿了… 想吃 ' + (['小鱼干','胡萝卜','鲜肉包'][Math.floor(Math.random() * 3)]), false); }
  else if (MOCK.mood <= 35 && Math.random() < 0.3) { fpBubble('陪我玩嘛～', false); }
}, 20000);

function buildTopbar() {
  $('#userChip').innerHTML = `<span>${esc(user.username)}</span><span class="role">${user.role === 'ADMIN' ? '管理员' : '用户'}</span>`;
  refreshStatus();
}
function isAdminPanel() { return user && user.role === 'ADMIN'; }

/* ═══════════════ 初始化 ═══════════════ */
function init() {
  renderAuth('login');
  drawScene('auth');
  if (token && user) {
    $('#authView').style.display = 'none';
    $('#appView').style.display = 'flex';
    $('#appView').classList.add('active');
    buildTopbar();
    buildRail();
    enterScene('home');
    initFloatPet();
  } else {
    drawScene('auth');
  }
  requestAnimationFrame(mainLoop);
  window.addEventListener('resize', () => {
    if ($('#appView').classList.contains('active')) { drawScene(SCENES.find(s => s.id === curScene).scene); positionBall(); }
    else drawScene('auth');
  });
}
init();
